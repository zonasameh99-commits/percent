<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OnePercent — Become 1% Better Every Day</title>
<meta name="description" content="A personal daily progress tracker. Build habits, track goals, and become 1% better every day." />

<link rel="preconnect" href="https://fonts.googleapis.com">

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-label="Toggle navigation menu">

  <nav class="mobile-nav" id="mobile-nav"></nav>

  <main class="view-root" id="view-root"></main>

<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
